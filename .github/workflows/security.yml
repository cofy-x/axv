name: Dependency security

on:
  workflow_call:
  schedule:
    - cron: '31 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      GOTOOLCHAIN: local
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.work
            apps/server/go.mod
            apps/server/go.sum
      - name: Install locked dependencies
        id: dependencies
        run: make deps PNPM=pnpm
      - name: Check JavaScript vulnerabilities
        run: make audit-js PNPM=pnpm
      - name: Check Go vulnerabilities
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: make audit-go PNPM=pnpm
