name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      full_browser_matrix:
        description: Run the full 6-project browser matrix (false runs Chromium only)
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  GOTOOLCHAIN: local

jobs:
  changes:
    name: Detect affected checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.classify.outputs.runtime }}
      macos_native: ${{ steps.classify.outputs.macos_native }}
      security: ${{ steps.classify.outputs.security }}
      e2e: ${{ steps.classify.outputs.e2e }}
      full_e2e: ${{ steps.classify.outputs.full_e2e }}
      guest_scripts: ${{ steps.classify.outputs.guest_scripts }}
      browser_matrix: ${{ steps.classify.outputs.browser_matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Classify changed paths
        id: classify
        env:
          FULL_BROWSER_MATRIX: ${{ inputs.full_browser_matrix != false }}
        run: node scripts/ci-changes.mjs

  format:
    name: Format and script syntax
    needs: changes
    if: needs.changes.outputs.runtime != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
          cache: true
      - name: Install locked JavaScript dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: make format-check PNPM=pnpm
      - name: Check guest shell scripts
        if: needs.changes.outputs.guest_scripts == 'true'
        run: |
          for script in images/guest/build-lima.sh images/guest/build-rootfs.sh; do
            bash -n "$script"
          done
          for script in images/guest/install-base.sh images/guest/package-inventory.sh images/guest/prepare-guest.sh; do
            sh -n "$script"
          done

  verification:
    name: Linux verification
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
          cache: true
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.work
            apps/server/go.mod
            apps/server/go.sum
      - name: Install host test prerequisites
        run: |
          # Retain HTTPS fallback mirrors for DNS/download failures.
          node scripts/ci-ubuntu-mirrors.mjs /etc/apt/apt-mirrors.txt "$RUNNER_TEMP/axv-apt-mirrors.txt"
          sudo install -m 0644 "$RUNNER_TEMP/axv-apt-mirrors.txt" /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install --yes tmux
      - name: Install locked dependencies
        run: make deps PNPM=pnpm
      - name: Check committed dependency files
        run: |
          dependency_status="$(git status --porcelain=v1 --untracked-files=all -- \
            .go-version .node-version .nvmrc .npmrc Makefile \
            package.json pnpm-lock.yaml pnpm-workspace.yaml go.work go.work.sum \
            ':(glob)**/package.json' ':(glob)**/go.mod' ':(glob)**/go.sum')"
          if [ -n "$dependency_status" ]; then
            printf '%s\n' "$dependency_status"
            exit 1
          fi
      - name: Check formatting, unit tests, types, lint and production build
        run: make format-check test typecheck lint build PNPM=pnpm
      - name: Check production behavior
        run: make smoke-production PNPM=pnpm
      - name: Check production installation
        run: AXV_TEST_PRODUCTION_INSTALL=1 pnpm exec vitest run scripts/install.test.mjs

  native:
    name: macOS native
    needs: changes
    if: needs.changes.outputs.macos_native == 'true'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.work
            apps/server/go.mod
            apps/server/go.sum
      - name: Install host test prerequisite
        run: |
          if ! command -v tmux >/dev/null; then
            brew install tmux
          fi
          tmux -V
      - name: Download Go modules
        working-directory: apps/server
        run: GOWORK=off go mod download
      - name: Check committed dependency files
        run: |
          dependency_status="$(git status --porcelain=v1 --untracked-files=all -- \
            .go-version .node-version .nvmrc .npmrc Makefile \
            package.json pnpm-lock.yaml pnpm-workspace.yaml go.work go.work.sum \
            ':(glob)**/package.json' ':(glob)**/go.mod' ':(glob)**/go.sum')"
          if [ -n "$dependency_status" ]; then
            printf '%s\n' "$dependency_status"
            exit 1
          fi
      - name: Check native host adapters
        run: |
          node scripts/test-go.mjs -race \
            ./apps/server/internal/profile/... \
            ./apps/server/internal/terminal/... \
            ./apps/server/internal/codex/... \
            ./apps/server/internal/compute/provider/lima
      - name: Build native server
        run: make build-go

  security:
    name: Security
    needs: changes
    if: needs.changes.outputs.security == 'true'
    uses: ./.github/workflows/security.yml

  checks:
    name: checks
    needs: [changes, format, verification, native, security]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require all applicable checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NEED_RUNTIME: ${{ needs.changes.outputs.runtime }}
          NEED_MACOS: ${{ needs.changes.outputs.macos_native }}
          NEED_SECURITY: ${{ needs.changes.outputs.security }}
          FORMAT_RESULT: ${{ needs.format.result }}
          VERIFICATION_RESULT: ${{ needs.verification.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$NEED_RUNTIME" = "true" ]; then
            test "$VERIFICATION_RESULT" = success
          else
            test "$FORMAT_RESULT" = success
            test "$VERIFICATION_RESULT" = skipped
          fi
          if [ "$NEED_MACOS" = "true" ]; then
            test "$NATIVE_RESULT" = success
          else
            test "$NATIVE_RESULT" = skipped
          fi
          if [ "$NEED_SECURITY" = "true" ]; then
            test "$SECURITY_RESULT" = success
          else
            test "$SECURITY_RESULT" = skipped
          fi

  browsers:
    name: browser (${{ matrix.project }}, shard ${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.browser_matrix) }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false
          cache: true
      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.work
            apps/server/go.mod
            apps/server/go.sum
      - name: Install host test prerequisites
        run: |
          # Retain HTTPS fallback mirrors for DNS/download failures.
          node scripts/ci-ubuntu-mirrors.mjs /etc/apt/apt-mirrors.txt "$RUNNER_TEMP/axv-apt-mirrors.txt"
          sudo install -m 0644 "$RUNNER_TEMP/axv-apt-mirrors.txt" /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install --yes tmux
      - name: Install locked dependencies
        run: make deps PNPM=pnpm
      - name: Install browser and system dependencies
        env:
          PLAYWRIGHT_BROWSER: ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps "$PLAYWRIGHT_BROWSER"
      - name: Check browser project
        env:
          BROWSER_PROJECT: ${{ matrix.project }}
          BROWSER_SHARD: ${{ matrix.shard }}
        run: pnpm test:e2e --project="$BROWSER_PROJECT" --shard="$BROWSER_SHARD/3"
      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: e2e
    needs: [changes, browsers]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require applicable browser checks to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NEED_E2E: ${{ needs.changes.outputs.e2e }}
          BROWSER_RESULT: ${{ needs.browsers.result }}
        run: |
          test "$CHANGES_RESULT" = success
          if [ "$NEED_E2E" = "true" ]; then
            test "$BROWSER_RESULT" = success
          else
            test "$BROWSER_RESULT" = skipped
          fi
