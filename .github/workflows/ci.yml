name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  GOTOOLCHAIN: local

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.work
            apps/server/go.mod
            apps/server/go.sum
      - name: Install host test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
      - name: Install locked dependencies
        run: make deps
      - name: Check formatting, unit tests, types, lint and production build
        run: make format-check test typecheck lint build
      - name: Check production behavior
        run: make smoke-production
      - name: Check production installation
        run: AXV_TEST_PRODUCTION_INSTALL=1 pnpm exec vitest run scripts/install.test.mjs

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.work
            apps/server/go.mod
            apps/server/go.sum
      - name: Install host test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
      - name: Install locked dependencies
        run: make deps
      - name: Install browser system dependencies
        run: pnpm exec playwright install-deps chromium firefox webkit
      - name: Check all browser projects
        run: make test-e2e
      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
