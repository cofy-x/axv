name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '47 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: go-linux
            language: go
            os: ubuntu-24.04
            build-mode: manual
          - target: go-darwin
            language: go
            os: macos-15
            build-mode: manual
          - target: javascript-typescript
            language: javascript-typescript
            os: ubuntu-24.04
            build-mode: none
          - target: actions
            language: actions
            os: ubuntu-24.04
            build-mode: none
    env:
      CI: 'true'
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly
      CGO_ENABLED: '0'
      # Full scans keep baseline triage and the extracted-file inventory complete.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'
      CODEQL_OVERLAY_DATABASE_MODE: none
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Set up pnpm
        if: matrix.language == 'go'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
          cache: true
      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache-dependency-path: |
            go.work
            apps/server/go.mod
            apps/server/go.sum
      - name: Prepare production embedding with locked dependencies
        if: matrix.language == 'go'
        run: |
          make deps PNPM=pnpm
          make build PNPM=pnpm
      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          tools: linked
          config-file: ./.github/codeql/config.yml
          db-location: .data/test/codeql-db
      - name: Extract all production Go packages in the workspace
        if: matrix.language == 'go'
        env:
          REPORT_DIRECTORY: .data/test/codeql-results/${{ matrix.target }}
        run: node scripts/codeql-coverage.mjs build "$REPORT_DIRECTORY"
      - name: Check committed dependency files
        if: matrix.language == 'go'
        run: |
          dependency_status="$(git status --porcelain=v1 --untracked-files=all -- \
            .go-version .node-version .nvmrc .npmrc Makefile \
            package.json pnpm-lock.yaml pnpm-workspace.yaml go.work go.work.sum \
            ':(glob)**/package.json' ':(glob)**/go.mod' ':(glob)**/go.sum')"
          if [ -n "$dependency_status" ]; then
            printf '%s\n' "$dependency_status"
            exit 1
          fi
      - name: Analyze and upload results
        id: analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}/target:${{ matrix.target }}
          output: .data/test/codeql-results/${{ matrix.target }}/sarif
          upload-database: false
          wait-for-processing: true
      - name: Verify actual Go extraction coverage
        if: matrix.language == 'go'
        env:
          CODEQL_BINARY: ${{ steps.init.outputs.codeql-path }}
          REPORT_DIRECTORY: .data/test/codeql-results/${{ matrix.target }}
        run: node scripts/codeql-coverage.mjs verify "$REPORT_DIRECTORY" "$CODEQL_BINARY" .data/test/codeql-db/go
      - name: Retain analysis and coverage evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-${{ matrix.target }}
          path: .data/test/codeql-results/${{ matrix.target }}/
          retention-days: 7
          if-no-files-found: warn
